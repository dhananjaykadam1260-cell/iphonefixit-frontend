name: iphonefixit-frontend
services:
  frontend:
    image: ${IMAGE:?Set IMAGE to the frontend image}
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  app:
    external: true
    name: iphonefixit
