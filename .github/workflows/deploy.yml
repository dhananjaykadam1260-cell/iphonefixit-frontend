name: Build and deploy frontend
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Select image
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            echo 'value=iphonefixit-frontend:ci' >> "$GITHUB_OUTPUT"
          else
            test -n "$DOCKERHUB_USERNAME"
            echo "value=${DOCKERHUB_USERNAME}/iphonefixit-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate public website URL
        if: github.event_name != 'pull_request'
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          [[ "$PUBLIC_URL" =~ ^https?://[^/[:space:]]+$ ]] || { echo 'Set PUBLIC_URL without a trailing slash'; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.value }}
          build-args: |
            VITE_BACKEND_URL=${{ vars.PUBLIC_URL || 'http://localhost' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_EC2_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY" && test -n "$EC2_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload release configuration
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$EC2_USER@$EC2_HOST" 'mkdir -p /opt/iphonefixit/frontend'
          scp -o BatchMode=yes deploy/compose.yaml deploy/deploy.sh "$EC2_USER@$EC2_HOST:/opt/iphonefixit/frontend/"
      - name: Deploy and wait for health check
        run: |
          [[ "$IMAGE" =~ ^[a-z0-9_-]+/iphonefixit-frontend:[a-f0-9]{40}$ ]]
          ssh -o BatchMode=yes "$EC2_USER@$EC2_HOST" "bash /opt/iphonefixit/frontend/deploy.sh '$IMAGE'"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
